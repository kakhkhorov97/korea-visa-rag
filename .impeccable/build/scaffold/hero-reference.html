<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: modern-demo-v1.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f4f5f5}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1547px">
  <div class="r-rail region chrome" data-region="rail"><!-- Ink-blue full-height navigation rail --></div>
  <div class="r-brand region text" data-region="brand"><!-- App name and Korean secondary name --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-ask-nav region control" data-region="ask-nav"><!-- Selected ask-a-question navigation: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop ask-nav); a control need not have button chrome --></div>
  <div class="r-search-methods region control" data-region="search-methods"><!-- Three search radio methods: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop search-methods); a control need not have button chrome --></div>
  <div class="r-topics region control" data-region="topics"><!-- Study work and family topic actions: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop topics); a control need not have button chrome --></div>
  <div class="r-owner region text" data-region="owner"><!-- Portfolio project owner attribution --><p style="font-size:var(--r-owner-font);line-height:1.05;margin:0">owner</p></div>
  <div class="r-topbar region chrome" data-region="topbar"><!-- Workspace breadcrumb and AI status --></div>
  <div class="r-breadcrumb region text" data-region="breadcrumb"><!-- Visa questions breadcrumb --><p style="font-size:var(--r-breadcrumb-font);line-height:1.05;margin:0">breadcrumb</p></div>
  <div class="r-status region text" data-region="status"><!-- AI answer enabled status --><p style="font-size:var(--r-status-font);line-height:1.05;margin:0">status</p></div>
  <div class="r-heading region text" data-region="heading"><!-- Modest serif welcome heading --><p style="font-size:var(--r-heading-font);font-family:var(--r-heading-family),sans-serif;font-weight:var(--r-heading-weight);line-height:1.05;margin:0">heading</p></div>
  <div class="r-conversation region chrome" data-region="conversation"><!-- Central question and answer workspace --></div>
  <div class="r-question region text" data-region="question"><!-- User visa question in blue bubble --><p style="font-size:var(--r-question-font);line-height:1.05;margin:0">question</p></div>
  <div class="r-answer-title region text" data-region="answer-title"><!-- E-9 example answer heading --><p style="font-size:var(--r-answer-title-font);line-height:1.05;margin:0">answer-title</p></div>
  <div class="r-answer-body region text" data-region="answer-body"><!-- Generated answer paragraphs with citations --><p style="font-size:var(--r-answer-body-font);line-height:1.05;margin:0">answer-body</p></div>
  <div class="r-answer-sources region control" data-region="answer-sources"><!-- Inline official source references: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop answer-sources); a control need not have button chrome --></div>
  <div class="r-evidence region chrome" data-region="evidence"><!-- Sage official evidence panel --></div>
  <div class="r-evidence-heading region text" data-region="evidence-heading"><!-- Sources heading and cited source count --><p style="font-size:var(--r-evidence-heading-font);line-height:1.05;margin:0">evidence-heading</p></div>
  <div class="r-source-card region control" data-region="source-card"><!-- Expandable original source and official link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop source-card); a control need not have button chrome --></div>
  <div class="r-source-note region text" data-region="source-note"><!-- Corpus coverage note --><p style="font-size:var(--r-source-note-font);line-height:1.05;margin:0">source-note</p></div>
  <div class="r-composer region control" data-region="composer"><!-- Question composer and send action: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop composer); a control need not have button chrome --></div>
</main>
</body>
</html>
