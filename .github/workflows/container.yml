name: container smoke test
on:
  push:
  pull_request:
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public image with secret canaries in the checkout
        run: |
          printf 'DO_NOT_PACKAGE_THIS_SECRET\n' > .env
          mkdir -p data/originals
          printf 'PRIVATE_MANUAL_CANARY\n' > data/originals/private-canary.hwp
          docker build -t visa-demo .
      - name: Verify image excludes local files
        run: |
          docker run --rm --entrypoint python visa-demo -c "from pathlib import Path; assert not Path('/app/.env').exists(); assert not Path('/app/data/raw').exists(); assert not Path('/app/data/originals').exists(); assert not Path('/app/.git').exists()"
      - name: Start keyless and exercise the real API
        run: |
          docker run -d --name visa-demo --memory=512m --cpus=0.5 -p 8000:8000 -e SEARCH_ONLY=true -e KIWI_LIGHTWEIGHT=true visa-demo
          trap 'docker logs visa-demo; docker rm -f visa-demo' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          python -c "import json; h=json.load(open('/tmp/health.json')); assert h['chunks'] == 44; assert h['llm'] is False; assert h['modes'] == ['bm25']"
          curl --fail --silent http://localhost:8000/ > /dev/null
          curl --fail --silent -H 'Content-Type: application/json' -d '{"question":"외국인등록 90일"}' http://localhost:8000/api/ask > /tmp/answer.json
          python -c "import json; a=json.load(open('/tmp/answer.json')); assert a['mode'] == 'search-only'; assert a['sources']; assert all(s['url'].startswith('https://www.law.go.kr/') for s in a['sources'])"
